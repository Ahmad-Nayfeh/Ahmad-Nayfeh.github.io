<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة إدارة ماراثون القراءة</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../img/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0B1222">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
<style>
  .t-marathon { --bg: #0B1222; --panel: #111A2E; --panel2: #141E34; --ink: #EEF1F7; --muted: #9AA6BD; --line: rgba(255,255,255,.12);
    --accent: #F2B84B; --accent-soft: rgba(242,184,75,.14); --on-accent: #14213D; --link: #F2B84B; --ok: #6CCB92; --bad: #F2B8B5;
    --btn-bg: linear-gradient(135deg, #F2B84B, #E0A23A); --glow: rgba(242,184,75,.45); }
  body { min-height: 100vh; font-size: 15px; line-height: 1.6;
    background: radial-gradient(1000px 520px at 50% -12%, #22386A, transparent 65%), var(--bg); }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; direction: ltr; unicode-bidi: embed; }
  [hidden] { display: none !important; }
  .top { padding: 16px 0; border-bottom: 1px solid var(--line); margin-bottom: 24px; }
  .brand img { width: 32px; height: 32px; }
  .who { display: flex; align-items: center; gap: 10px; font-size: .9rem; color: var(--muted); }
  .chip-btn { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 10px; padding: 6px 12px; font: inherit; font-size: .85rem; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .chip-btn:hover { border-color: var(--accent); }
  .chip-btn svg { width: 16px; height: 16px; }

  /* Sign-in */
  .gate { max-width: 28rem; margin: 9vh auto 0; text-align: center; }
  .gate img { width: 76px; height: 76px; margin: 0 auto 14px; }
  .gate h1 { font-family: "Amiri", serif; font-size: 2.2rem; }
  .gbtn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; width: 100%; min-height: 54px; border-radius: 16px;
    border: 0; background: #fff; color: #1F1F1F; font: inherit; font-weight: 700; font-size: 1rem; cursor: pointer; margin-top: 18px; }
  .gbtn:disabled { opacity: .6; cursor: progress; }
  .note { font-size: .88rem; color: var(--muted); margin-top: 14px; }
  .err { color: var(--bad); }

  /* Dashboard */
  h1.title { font-size: 1.6rem; margin: 0; }
  .sub { color: var(--muted); font-size: .9rem; margin: 2px 0 18px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
  @media (max-width: 980px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
  .kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .kpi b { display: block; font-size: 1.7rem; line-height: 1.2; }
  .kpi span { color: var(--muted); font-size: .82rem; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin-top: 16px; }
  .card h2 { font-size: 1.05rem; margin: 0 0 12px; display: flex; align-items: center; gap: 10px; }
  .card h2::before { content: ""; width: 4px; height: 16px; border-radius: 2px; background: var(--accent); }
  .card h2 .grow { flex: 1; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: .82rem; }
  .chart { width: 100%; height: 160px; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .tools input { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--ink);
    padding: 10px 14px; font: inherit; }
  .tools input:focus { outline: none; border-color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { text-align: start; color: var(--muted); font-weight: 500; font-size: .78rem; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr.row { cursor: pointer; }
  tr.row:hover td { background: var(--accent-soft); }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pill { display: inline-block; font-size: .72rem; padding: 2px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .pill.dim { background: rgba(255,255,255,.07); color: var(--muted); }
  .pill.ok { background: rgba(108,203,146,.15); color: var(--ok); }
  .empty { color: var(--muted); padding: 18px 4px; text-align: center; }
  .more { margin-top: 10px; }

  /* Detail drawer */
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 20; }
  .drawer { position: fixed; inset-block: 0; inset-inline-end: 0; width: min(720px, 100%); background: var(--bg); border-inline-start: 1px solid var(--line);
    z-index: 21; overflow-y: auto; padding: 20px; }
  .drawer h2.dn { font-family: "Amiri", serif; font-size: 1.9rem; margin: 6px 0 2px; }
  .grid2 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 4px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: repeat(2, 1fr); } }
  .loading { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 60px 0; color: var(--muted); }
  .spin { width: 22px; height: 22px; border: 2.5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: s 1s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }

  /* Tabs, forms, dialogs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding: 4px 0 2px; margin: 4px 0 10px; }
  .tab { background: transparent; border: 1px solid var(--line); color: var(--ink); border-radius: 12px; padding: 8px 14px; font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
  .tab .n { display: inline-block; min-width: 20px; padding: 0 6px; margin-inline-start: 6px; border-radius: 99px; background: var(--bad); color: #2a0b0b; font-size: .75rem; }
  .btn-a { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; padding: 9px 16px; font: inherit; font-weight: 600; cursor: pointer; }
  .btn-a:disabled { opacity: .5; cursor: default; }
  .btn-d { background: transparent; color: var(--bad); border: 1px solid rgba(242,184,181,.4); border-radius: 12px; padding: 8px 14px; font: inherit; cursor: pointer; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .field { display: block; margin-top: 12px; }
  .field span { display: block; color: var(--muted); font-size: .8rem; margin-bottom: 4px; }
  .field input, .field textarea, .field select, select.mini { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; color: var(--ink); padding: 9px 12px; font: inherit; }
  select.mini { width: auto; padding: 4px 8px; border-radius: 8px; font-size: .85rem; }
  .field textarea { min-height: 90px; resize: vertical; }
  .field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
  .seg { display: inline-flex; gap: 6px; margin: 4px 0 10px; }
  .muted { color: var(--muted); }
  .small { font-size: .82rem; }
  .toast { position: fixed; bottom: 22px; inset-inline: 0; margin: auto; width: fit-content; max-width: 90vw; background: var(--ink); color: var(--bg);
    padding: 10px 18px; border-radius: 12px; z-index: 40; font-weight: 500; }
  .toast.err { background: var(--bad); color: #2a0b0b; }
  .pick { cursor: pointer; padding: 8px 10px; border-radius: 10px; }
  .pick:hover { background: var(--accent-soft); }
  .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .split2 { grid-template-columns: 1fr; } }
</style>
</head>
<body class="t-marathon">
<div class="wrap">
  <header class="top">
    <a class="brand" href="../"><img src="../img/icon.svg" alt=""> ماراثون القراءة · الإدارة</a>
    <div class="who" id="who" hidden>
      <span id="who-email" class="mono"></span>
      <button class="chip-btn" id="btn-refresh" title="تحديث">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5"/></svg>تحديث</button>
      <button class="chip-btn" id="btn-out">خروج</button>
    </div>
  </header>

  <section class="gate" id="gate" hidden>
    <img src="../img/icon.svg" alt="">
    <h1>لوحة إدارة المنصة</h1>
    <p class="muted">لمدير منصة ماراثون القراءة فقط. ادخل بحساب Google المخصص للإدارة.</p>
    <button class="gbtn" id="btn-google">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2c-2 1.5-4.5 2.4-7.2 2.4-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      الدخول بحساب Google
    </button>
    <p class="note" id="gate-msg"></p>
  </section>

  <div class="loading" id="loading"><span class="spin"></span> جارٍ التحميل…</div>

  <main id="dash" hidden>
    <h1 class="title">لوحة إدارة المنصة</h1>
    <p class="sub" id="stamp"></p>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <div id="view"></div>
    <p class="note" style="margin:24px 0 48px">البيانات تُقرأ وتُكتب مباشرة في Firestore بصلاحية مدير المنصة. قواعد الأمان تمنع أي حساب آخر من ذلك، وكل تعديل يُسجَّل في «السجل».</p>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"></aside>
<div class="toast" id="toast" hidden></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut,
  connectAuthEmulator, signInWithCredential } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, collectionGroup, getDocs, getDoc, doc, setDoc, updateDoc, deleteDoc, addDoc, writeBatch,
  query, where, orderBy, limit, deleteField, arrayRemove, connectFirestoreEmulator, getCountFromServer }
  from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const ADMIN = "readingmarathon.admin@gmail.com";
const app = initializeApp({
  apiKey: "AIzaSyDUyZGapP25-238T8XPYwAIIUK5UkmjsSQ",
  authDomain: "reading-marathon-38b4f.firebaseapp.com",
  projectId: "reading-marathon-38b4f",
  storageBucket: "reading-marathon-38b4f.firebasestorage.app",
  messagingSenderId: "957581663524",
  appId: "1:957581663524:web:9a7aa0d42bfaeb9d9667b1",
});
const auth = getAuth(app);
const db = getFirestore(app);
// Local testing only: on localhost with ?emulator, talk to the Firebase emulators instead of production.
if (location.hostname === "localhost" && new URLSearchParams(location.search).has("emulator")) {
  connectAuthEmulator(auth, "http://127.0.0.1:9099", { disableWarnings: true });
  connectFirestoreEmulator(db, "127.0.0.1", 8085);
  window.__signInAs = (email, sub) => signInWithCredential(auth,
    GoogleAuthProvider.credential(JSON.stringify({ sub, email, email_verified: true })));
}
const $ = (id) => document.getElementById(id);
const show = (id, on = true) => { $(id).hidden = !on; };

// Everything users type (names, titles) is untrusted: always escape before it touches HTML.
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const hours = (m) => (Math.round((m / 60) * 10) / 10).toLocaleString("en-US");
const months = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const iso = (d) => d.toISOString().slice(0, 10);
const fmtDate = (s) => { if (!s) return "—"; const [y, m, d] = s.split("-").map(Number); return `${d} ${months[m - 1]} ${y}`; };
const ms2iso = (ms) => (ms ? iso(new Date(ms)) : null);
function rel(s) {
  if (!s) return "—";
  const days = Math.round((new Date(iso(new Date())) - new Date(s)) / 864e5);
  if (days <= 0) return "اليوم";
  if (days === 1) return "أمس";
  if (days < 30) return `قبل ${days} يوماً`;
  return fmtDate(s);
}
const parentId = (path) => path.split("/")[1] || "";
const newId = (p) => p + Array.from(crypto.getRandomValues(new Uint8Array(12)), (b) => "abcdefghijkmnopqrstuvwxyz23456789"[b % 33]).join("");

// Same search keys as the app (core/Catalog.kt), so books saved here are found there.
const normalize = (s) => String(s ?? "").trim().replace(/[ً-ْٰـ]/g, "").replace(/[إأآٱ]/g, "ا")
  .replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").toLowerCase();
const words = (t) => normalize(t).split(/[^\p{L}\p{N}]+/u).filter(Boolean);
const forms = (w) => (w.startsWith("ال") && w.length > 3 ? [w, w.slice(2)] : [w]);
function bookKeys(title, author, aliases) {
  const out = new Set();
  for (const w of [title, author, ...aliases].flatMap(words).flatMap(forms)) for (let n = 2; n <= Math.min(w.length, 12); n++) out.add(w.slice(0, n));
  return [...out];
}
const matches = (q, b) => { const qs = words(q).map((w) => forms(w).at(-1)); const hay = [b.title, b.author, ...(b.aliases || [])].flatMap(words).flatMap(forms);
  return qs.length > 0 && qs.every((w) => hay.some((h) => h.startsWith(w))); };
const sameBook = (title, author, list) => list.find((b) => b.status !== "merged" && (normalize(b.title) === normalize(title) || (b.aliases || []).some((a) => normalize(a) === normalize(title)))
  && (!author || normalize(b.author) === normalize(author)));

let data = null;
let tab = "overview";
let showAllUsers = false;
let suggView = "open";
let bookFilter = "all";

function toast(text, bad = false) {
  const t = $("toast");
  t.textContent = text; t.className = "toast" + (bad ? " err" : ""); t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.hidden = true), 3500);
}
function friendly(e) {
  const c = e?.code || e?.message || "";
  if (String(c).includes("permission")) return "رفضت قواعد الأمان هذا الإجراء. تأكد من نشر آخر نسخة منها.";
  return "تعذّر الإكمال: " + c;
}
/** Runs a write, logs it, reloads. */
async function act(label, target, fn, done = "تم.") {
  try {
    await fn();
    await addDoc(collection(db, "adminLog"), { at: Date.now(), action: label, target: String(target ?? "") });
    toast(done);
    closeDrawer();
    await load(true);
  } catch (e) { console.error(e); toast(friendly(e), true); }
}
/** Firestore batches hold at most 500 writes. */
async function commitAll(ops) {
  for (let i = 0; i < ops.length; i += 450) {
    const b = writeBatch(db);
    for (const op of ops.slice(i, i + 450)) op(b);
    await b.commit();
  }
}

/** Books from Firestore matching a query (one key on the server, the rest checked here), kept in the cache. */
async function findBooks(q, max = 60) {
  const key = words(q).flatMap(forms).sort((a, b) => b.length - a.length)[0]?.slice(0, 12);
  if (!key || key.length < 2) return [];
  const snap = await getDocs(query(collection(db, "books"), where("keys", "array-contains", key), limit(max)));
  const got = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
  for (const b of got) { const i = data.books.findIndex((x) => x.id === b.id); if (i >= 0) data.books[i] = b; else data.books.push(b); }
  return got.filter((b) => b.status !== "merged" && matches(q, b));
}

/** The starting catalog (the same list the app ships) is copied into Firestore once; the app does the same. */
let seeding = false;
async function seedCatalog() {
  if (seeding) return; seeding = true;
  try {
    const marker = doc(db, "adminLog", "seed-catalog-1");
    if ((await getDoc(marker)).exists()) return;
    const list = await (await fetch("catalog.json")).json();
    const have = new Set((await getDocs(collection(db, "books"))).docs.map((d) => d.id));
    const now = Date.now(), ops = [];
    for (const [id, title, author, aliases] of list) if (!have.has(id)) ops.push((b) => b.set(doc(db, "books", id), bookDoc({ id, title, author, aliases, pages: null, status: "verified", mergedInto: null, createdAt: now })));
    toast(`يُنسخ فهرس الكتب الأولي (${ops.length} كتاباً)...`);
    await commitAll(ops);
    await setDoc(marker, { at: now, action: "أضاف فهرس الكتب الأولي", target: `${ops.length} كتاباً` });
    data.bookCount = (data.bookCount || 0) + ops.length;
    toast(`أُضيف ${ops.length} كتاباً إلى الفهرس.`);
    if (tab === "books" || tab === "overview") render();
  } catch (e) { console.error(e); seeding = false; }
}

// ---- Auth ----
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account", login_hint: ADMIN });
$("btn-google").onclick = async () => {
  $("btn-google").disabled = true;
  $("gate-msg").textContent = "";
  try {
    await signInWithPopup(auth, provider);
  } catch (e) {
    if (e.code === "auth/popup-blocked" || e.code === "auth/operation-not-supported-in-this-environment") { await signInWithRedirect(auth, provider); return; }
    if (e.code !== "auth/popup-closed-by-user" && e.code !== "auth/cancelled-popup-request") $("gate-msg").innerHTML = `<span class="err">تعذّر الدخول: ${esc(e.code || e.message)}</span>`;
  } finally { $("btn-google").disabled = false; }
};
getRedirectResult(auth).catch((e) => { $("gate-msg").innerHTML = `<span class="err">تعذّر الدخول: ${esc(e.code)}</span>`; });
$("btn-out").onclick = () => signOut(auth);
$("btn-refresh").onclick = () => load();

onAuthStateChanged(auth, (user) => {
  show("loading", false);
  if (!user) { show("gate"); show("dash", false); show("who", false); return; }
  const email = (user.email || "").toLowerCase();
  $("who-email").textContent = email || "ضيف";
  show("who");
  if (email !== ADMIN || !user.emailVerified) {
    show("gate"); show("dash", false);
    $("gate-msg").innerHTML = `<span class="err">الحساب ${esc(email || "الحالي")} ليس حساب مدير المنصة.</span> اخرج وادخل بحساب ${esc(ADMIN)}.`;
    return;
  }
  show("gate", false);
  load();
});

// ---- Data ----
async function load(quiet = false) {
  if (!quiet) { show("dash", false); show("loading"); }
  try {
    const [gs, us, mem, ent, ch, fin, dys, bks, sgs, ann, ban, lg, rds, shf] = await Promise.all([
      getDocs(collection(db, "groups")), getDocs(collection(db, "users")),
      getDocs(collectionGroup(db, "members")), getDocs(collectionGroup(db, "entries")),
      getDocs(collectionGroup(db, "challenges")), getDocs(collectionGroup(db, "finishes")),
      getDocs(collectionGroup(db, "days")), getDocs(query(collection(db, "books"), where("status", "==", "pending"))), getDocs(collection(db, "suggestions")),
      getDocs(collection(db, "announcements")), getDocs(collection(db, "banned")),
      getDocs(query(collection(db, "adminLog"), orderBy("at", "desc"), limit(200))),
      getDocs(collectionGroup(db, "reads")), getDocs(collectionGroup(db, "shelf")),
    ]);
    const bucket = (snap) => { const out = {}; for (const d of snap.docs) (out[parentId(d.ref.path)] ||= []).push({ id: d.id, ref: d.ref, ...d.data() }); return out; };
    const days = bucket(dys), reads = bucket(rds), shelves = bucket(shf);
    const banned = new Set(ban.docs.map((d) => d.id));
    const users = us.docs.map((d) => ({ uid: d.id, ...d.data(), days: days[d.id] || [], reads: reads[d.id] || [], shelf: shelves[d.id] || [], minutes: (days[d.id] || []).reduce((a, x) => a + (x.minutes || 0), 0), banned: banned.has(d.id) }));
    const byUid = Object.fromEntries(users.map((u) => [u.uid, u]));
    const members = bucket(mem), entries = bucket(ent), challenges = bucket(ch), finishes = bucket(fin);
    const week = iso(new Date(Date.now() - 6 * 864e5));
    const groups = gs.docs.map((d) => {
      const g = d.data(); const roles = g.roles || {}; const es = entries[d.id] || [];
      return {
        id: d.id, ...g, name: g.name || "—", code: g.inviteCode || "", createdAt: g.createdAt || 0, roles, visibility: g.visibility || "private",
        rules: { minutesPerPoint: 10, finishBonus: 50, countAll: true, ...(g.rules || {}) },
        owners: Object.keys(roles).filter((u) => roles[u] === "owner").map((u) => byUid[u]?.email || byUid[u]?.name || "ضيف"),
        members: members[d.id] || [], entries: es, challenges: challenges[d.id] || [], finishes: finishes[d.id] || [],
        minutes: es.reduce((a, e) => a + (e.minutes || 0), 0),
        minutes7: es.filter((e) => e.date >= week).reduce((a, e) => a + (e.minutes || 0), 0),
        last: es.filter((e) => e.minutes > 0).map((e) => e.date).sort().pop() || null,
      };
    }).sort((a, b) => (b.last || "").localeCompare(a.last || "") || b.createdAt - a.createdAt);
    data = {
      groups, users: users.sort((a, b) => (b.lastSeen || 0) - (a.lastSeen || 0)), byUid, allDays: dys.docs.map((d) => d.data()),
      allChallenges: ch.docs.map((d) => ({ id: d.id, ref: d.ref, gid: parentId(d.ref.path), ...d.data() })),
      finishes: fin.size, week,
      // The catalog is thousands of books: only pending ones and the ones in use are loaded; the rest by search.
      books: bks.docs.map((d) => ({ id: d.id, ...d.data() })),
      bookCount: (await getCountFromServer(collection(db, "books"))).data().count - (await getCountFromServer(query(collection(db, "books"), where("status", "==", "merged")))).data().count,
      suggestions: sgs.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (a.status === "open" ? 0 : 1) - (b.status === "open" ? 0 : 1) || (b.createdAt || 0) - (a.createdAt || 0)),
      news: ann.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
      log: lg.docs.map((d) => d.data()),
    };
    const wanted = new Set([...data.suggestions.flatMap((x) => [x.bookId, x.otherBookId]), ...data.allChallenges.map((c) => c.bookId)].filter(Boolean));
    for (const b of data.books) wanted.delete(b.id);
    for (const snap of await Promise.all([...wanted].map((id) => getDoc(doc(db, "books", id))))) if (snap.exists()) data.books.push({ id: snap.id, ...snap.data() });
    seedCatalog();
    render();
    $("stamp").textContent = `آخر تحديث: ${new Date().toLocaleTimeString("ar-SA-u-nu-latn", { hour: "2-digit", minute: "2-digit" })}`;
    show("dash");
  } catch (e) {
    console.error(e);
    $("stamp").innerHTML = `<span class="err">تعذّرت قراءة البيانات (${esc(e.code || e.message)}). تأكد من نشر قواعد الأمان.</span>`;
    show("dash");
  } finally { show("loading", false); }
}

function bars(vals, color = "#3C4A6B", last = "#F2B84B") {
  const max = Math.max(1, ...vals); const bw = 600 / vals.length;
  return vals.map((v, i) => { const h = Math.max(v > 0 ? 3 : 1, (v / max) * 140); const x = (vals.length - 1 - i) * bw;
    return `<rect x="${x + 3}" y="${155 - h}" width="${bw - 6}" height="${h}" rx="3" fill="${i === vals.length - 1 ? last : color}"><title>${v}</title></rect>`; }).join("");
}

// Groups reading a book get its new title and author.
async function propagate(fromId, to) {
  const ops = [];
  for (const c of data.allChallenges.filter((c) => c.bookId === fromId)) ops.push((b) => b.update(c.ref, { bookId: to.id, title: to.title, author: to.author }));
  for (const g of data.groups.filter((g) => g.current?.bookId === fromId)) ops.push((b) => b.update(doc(db, "groups", g.id), { current: { ...g.current, bookId: to.id, title: to.title, author: to.author } }));
  await commitAll(ops);
}
function bookDoc(b) {
  return { title: b.title, author: b.author, aliases: b.aliases, keys: bookKeys(b.title, b.author, b.aliases), pages: b.pages ?? null,
    status: b.status, mergedInto: b.mergedInto ?? null, createdBy: b.createdBy ?? auth.currentUser.uid, createdAt: b.createdAt || Date.now() };
}
async function saveBook(id, title, author, aliases, pages, prev) {
  if (!title || !author) throw { message: "اكتب العنوان والمؤلف." };
  const b = { ...(prev || {}), id: id || newId("b_"), title, author, pages, status: "verified",
    aliases: [...new Map(aliases.filter((a) => a && normalize(a) !== normalize(title)).map((a) => [normalize(a), a])).values()] };
  await setDoc(doc(db, "books", b.id), bookDoc(b));
  if (id) await propagate(id, b);
  return b;
}

    <div class="row-actions"><button class="btn-a" id="f-save">${b?.status === "pending" ? "حفظ واعتماد" : "حفظ"}</button>${b ? '<button class="btn-d" id="f-del">حذف من الفهرس</button>' : ""}</div>

      <label class="field"><input id="m-q" placeholder="ابحث في الفهرس"></label><div id="m-res"></div></div>` : ""}`);

    return act(b ? "عدّل كتاباً" : "أضاف كتاباً", `«${title}» · ${author}`, () => saveBook(b?.id, title, author, aliases, pages, b), "حُفظ الكتاب.");

  $("m-q").oninput = async () => {

    $("m-res").innerHTML = res.map((x) => `<div class="pick" data-id="${esc(x.id)}">«${esc(x.title)}» · ${esc(x.author)}</div>`).join("");
    for (const p of document.querySelectorAll("#m-res .pick")) p.onclick = () => {
      const into = data.books.find((x) => x.id === p.dataset.id);
      if (confirm(`دمج «${b.title}» في «${into.title}»؟`)) act("دمج كتابين", `«${b.title}» ← «${into.title}»`, () => mergeBooks(b, into), "دُمج الكتابان.");
    };
  };
}
async function mergeBooks(from, into) {
  const kept = { ...into, aliases: [...new Map([...(into.aliases || []), from.title, ...(from.aliases || [])].filter((a) => normalize(a) !== normalize(into.title)).map((a) => [normalize(a), a])).values()] };
  const b = writeBatch(db);
  b.set(doc(db, "books", into.id), bookDoc(kept));
  b.set(doc(db, "books", from.id), bookDoc({ ...from, status: "merged", mergedInto: into.id }));
  await b.commit();
  await propagate(from.id, kept);
}
function openImport() {
  openDrawer(`<h2 class="dn">استيراد قائمة كتب</h2>
    <p class="small muted">سطر لكل كتاب: العنوان، المؤلف، أسماء أخرى مفصولة بـ «؛»، عدد الصفحات. يمكنك اللصق من Excel بعد حفظه CSV. الموجود في الفهرس يُتخطّى.</p>
    <label class="field"><textarea id="imp" placeholder="الأيام,طه حسين&#10;رجال في الشمس,غسان كنفاني,,96" style="min-height:240px"></textarea></label>
    <p class="small" id="imp-n"></p><div class="row-actions"><button class="btn-a" id="imp-go">استيراد</button></div>`);
  const parse = () => val("imp").split(/\r?\n/).map((l) => { const c = l.split(/[,\t]/); return { title: (c[0] || "").replace(/^"|"$/g, "").trim(), author: (c[1] || "").replace(/^"|"$/g, "").trim(),
    aliases: (c[2] || "").split(/[;؛]/).map((s) => s.trim()).filter(Boolean), pages: parseInt(c[3]) || null }; }).filter((x) => x.title && x.author && x.title !== "العنوان" && x.title.toLowerCase() !== "title");
  $("imp").oninput = () => { $("imp-n").textContent = `${parse().length} كتاباً جاهزاً`; };
  $("imp-go").onclick = () => {

    act("استورد قائمة كتب", `${list.length} سطراً`, async () => {
      const known = [...data.books]; const ops = [];
      for (const x of list) {

        const b = { ...x, id: newId("b_"), status: "verified", createdAt: Date.now() };
        known.push(b); added++; ops.push((batch) => batch.set(doc(db, "books", b.id), bookDoc(b)));

// ---- CSV ----
function exportCsv() {
  const cell = (v) => { const s = String(v ?? ""); return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; };
  const rows = [["group", "visibility", "invite_code", "owners", "readers", "books", "hours", "hours_last_7_days", "last_reading", "created"]];
  for (const g of data.groups) rows.push([g.name, g.visibility, g.code, g.owners.join(" / "), g.members.filter((x) => x.active !== false).length, g.challenges.length, hours(g.minutes), hours(g.minutes7), g.last || "", ms2iso(g.createdAt) || ""]);
  rows.push([]);
  rows.push(["name", "account", "type", "groups", "hours", "created", "last_seen", "suspended"]);
  for (const u of data.users) rows.push([u.name || "", u.email || "", u.guest ? "guest" : "google", (u.groups || []).length, hours(u.minutes), ms2iso(u.createdAt) || "", ms2iso(u.lastSeen) || "", u.banned ? "yes" : ""]);
  const blob = new Blob(["﻿" + rows.map((r) => r.map(cell).join(",")).join("\n")], { type: "text/csv;charset=utf-8" });
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: `reading-marathon-${iso(new Date())}.csv` });
  a.click();
  URL.revokeObjectURL(a.href);
}
