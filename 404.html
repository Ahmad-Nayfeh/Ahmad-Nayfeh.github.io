<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>انتقل الموقع · This site has moved</title>
<!--
  This address has moved to https://ahmadnayfeh.com.
  GitHub Pages cannot redirect on the server, so this one page is served for every
  old address (it is both index.html and 404.html) and sends the visitor to the
  matching new address, keeping the query string and the part after "#".
-->
<script>
(function () {
  var NEW = "https://ahmadnayfeh.com";
  // Old file names that changed.
  var FILES = {
    "/khatwa/khatwa-0.10.0.apk": "/apps/khatwa/khatwa.apk",
    "/reel/reel-1.0.0.apk": "/apps/reel/reel.apk",
    "/marathon/reading-marathon-0.1.0.apk": "/apps/marathon/reading-marathon.apk"
  };
  // Browser apps now run one level down, at /apps/<app>/app/.
  var RUNNING = { "munazara": 1, "voxa": 1, "grid-shift": 1 };
  // Files that sit beside an app's page rather than inside the running app.
  var BESIDE = { "voxa.apk": 1, "latest.json": 1 };

  function target(path) {
    path = path.replace(/\/index\.html$/, "/");
    if (FILES[path]) return FILES[path];
    var parts = path.split("/").filter(Boolean);
    if (parts.length === 0) return "/apps/";
    if (parts[0] === ".well-known") return path;
    if (parts[0] === "assets") return "/apps/" + parts.join("/");
    var app = parts[0], rest = parts.slice(1);
    var tail = rest.join("/") + (rest.length && /\/$/.test(path) ? "/" : "");
    if (RUNNING[app]) {
      if (rest[0] === "about") return "/apps/" + app + "/";            // the old information page
      if (rest.length === 1 && BESIDE[rest[0]]) return "/apps/" + app + "/" + rest[0];
      return "/apps/" + app + "/app/" + tail;                          // the app itself and its files
    }
    return "/apps/" + app + "/" + tail;
  }

  var url = NEW + target(location.pathname) + location.search + location.hash;
  window.__moved = url;
  location.replace(url);
})();
</script>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #1B3BDB; color: #fff;
    font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; line-height: 1.8; }
  a { color: #fff; font-weight: 700; }
  h1 { font-size: 2rem; margin: 0 0 .3em; }
</style>
</head>
<body>
<main>
  <h1>انتقل الموقع إلى ahmadnayfeh.com</h1>
  <p lang="en" dir="ltr">This site has moved to <a id="go" href="https://ahmadnayfeh.com/apps/">ahmadnayfeh.com</a>.</p>
</main>
<script>if (window.__moved) document.getElementById("go").href = window.__moved;</script>
</body>
</html>
